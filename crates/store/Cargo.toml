[package]
name = "store"
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
circular-protocol = { package = "protocol", path = "../protocol" }
circular-core = { path = "../core" }
circular-runtime = { package = "runtime", path = "../runtime" }
rusqlite = { version = "=0.32.1", features = ["bundled"] }
sha2 = "=0.10.9"
ring = "=0.17.14"

[dev-dependencies]
circular-testkit = { package = "testkit", path = "../testkit" }

[features]
test-support = ["rusqlite/hooks"]

[lib]
path = "src/lib.rs"
