[package]
name = "actors"
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
circular-core = { path = "../core" }
circular-expr = { package = "expr", path = "../expr" }
circular-runtime = { package = "runtime", path = "../runtime" }
circular-protocol = { package = "protocol", path = "../protocol" }
serde_json = { version = "1", default-features = false, features = ["std"] }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }

[dev-dependencies]
circular-plan = { package = "plan", path = "../plan" }
circular-runtime = { package = "runtime", path = "../runtime", features = ["test-support"] }
circular-testkit = { package = "testkit", path = "../testkit" }

[lib]
path = "src/lib.rs"
