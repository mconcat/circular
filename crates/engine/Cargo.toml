[package]
name = "engine"
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = ["circular-runtime/test-support"]

[dependencies]
arc-swap = "=1.9.1"
circular-cli = { package = "cli", path = "../cli" }
circular-expr = { package = "expr", path = "../expr" }
circular-core = { path = "../core" }
circular-actors = { package = "actors", path = "../actors" }
circular-plan = { package = "plan", path = "../plan" }
circular-protocol = { package = "protocol", path = "../protocol" }
circular-runtime = { package = "runtime", path = "../runtime" }
circular-store = { package = "store", path = "../store" }
circular-transport = { package = "transport", path = "../transport" }
engine-secrets = { path = "../engine-secrets" }
serde_json = { version = "1", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
getrandom = "=0.4.3"
toml_edit = "=0.22.27"
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "sync", "time", "macros"] }
# ureq 2 debug/trace logs include URLs and arbitrary request header values.
# Credential-bearing transports must never compile those diagnostics.
log = { version = "=0.4.34", features = ["max_level_info"] }
ureq = "2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["signal", "poll", "fs"] }

[dev-dependencies]
engine = { path = ".", features = ["test-support"] }
circular-runtime = { package = "runtime", path = "../runtime", features = ["test-support"] }
circular-store = { package = "store", path = "../store", features = ["test-support"] }
circular-testkit = { package = "testkit", path = "../testkit" }

[lib]
path = "src/lib.rs"

# The product executables are explicit targets rather than auto-discovered files.
[[bin]]
name = "circular-daemon"
path = "src/bin/circular-daemon/main.rs"
