[package]
name = "transport"
version = "0.1.0-alpha.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
circular-core = { path = "../core" }
circular-protocol = { package = "protocol", path = "../protocol" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "socket", "user"] }

[dev-dependencies]
circular-testkit = { package = "testkit", path = "../testkit" }

[lib]
path = "src/lib.rs"
