[workspace]
exclude = ["vendor/cel"]
members = [
    "crates/cli",
    "crates/core",
    "crates/engine",
    "crates/engine-secrets",
    "crates/expr",
    "crates/actors",
    "crates/plan",
    "crates/protocol",
    "crates/runtime",
    "crates/store",
    "crates/testkit",
    "crates/transport",
]
default-members = [
    "crates/cli",
    "crates/core",
    "crates/engine",
    "crates/engine-secrets",
    "crates/expr",
    "crates/actors",
    "crates/plan",
    "crates/protocol",
    "crates/runtime",
    "crates/store",
    "crates/testkit",
    "crates/transport",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT"
publish = false
# The pinned GPUI revision uses std::hint::cold_path (stable since Rust 1.95);
# its slice::as_array use needs 1.93, above locked icu_normalizer's 1.88.
rust-version = "1.95"

[profile.dev]
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
cel = { path = "vendor/cel" }
